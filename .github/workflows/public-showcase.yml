name: Public showcase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:public-surface
      - run: npm run typecheck:app
      - run: npm run typecheck:worker
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
